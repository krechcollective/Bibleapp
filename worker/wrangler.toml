name = "bibleapp-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "bibleapp"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "PASSAGE_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
ENVIRONMENT = "development"

# Secrets (set via `wrangler secret put`, never committed):
#   ESV_API_KEY      - api.esv.org application key
#   BIBLE_API_KEY    - scripture.api.bible key (for The Message)
